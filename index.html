<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contract Simulator · Práctica en pantallas reales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020f08;--ink:#eaf5ec;--muted:#9fbfa6;--line:rgba(234,245,236,.14);
  --brand:#92D050;--star:#E23B3B;--ok:#7FE07A;--bad:#FF6B6B;--warn:#FFC857;--w:#92D050;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#020f08}}
:root[data-theme="dark"]{--bg:#020f08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--w);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.star{display:inline-block;width:14px;height:14px;background:var(--star);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:11px 20px;border-radius:999px;background:var(--w);color:#04140a}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{font-size:14px;padding:7px 14px}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(2,15,8,.85);backdrop-filter:blur(8px);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.top .who{font-family:var(--display);font-weight:600;display:flex;gap:8px;align-items:center;margin-right:auto;min-width:0}
.top .who span.rl{color:var(--muted);font-weight:500;font-size:13px}
.metric{font-family:var(--display);font-size:12px;color:var(--muted);display:flex;flex-direction:column;line-height:1.1}
.metric b{font-size:17px;color:var(--ink)}
.pre{font-family:var(--display);font-size:11px;font-weight:700;color:#04140a;background:var(--warn);padding:3px 8px;border-radius:6px}

/* intro */
.intro{flex:1;display:grid;place-items:center;padding:28px 20px}
.intro-in{max-width:680px}
.kicker{font-family:var(--display);font-weight:600;color:var(--brand);display:flex;gap:8px;align-items:center}
.hero{font-size:clamp(38px,8.5vw,84px);font-weight:700;line-height:.95;margin:12px 0 10px;text-transform:uppercase}
.hero span{display:block;-webkit-text-stroke:1.5px var(--brand);color:transparent}
.intro p{color:#cfe3d3;font-size:18px;margin:.6em 0;max-width:60ch}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:18px 0}
.legend div{border-left:3px solid var(--brand);padding:6px 12px;font-size:14.5px;color:#dcebdf}
.legend div.p{border-color:var(--warn)}
.legend b{display:block;font-family:var(--display);color:var(--ink)}
.namebox{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.namebox input,.namebox select{flex:1 1 200px;font:inherit;font-size:17px;padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink)}
.namebox select option{color:#000}

/* map */
.route{flex:1;max-width:980px;width:100%;margin:0 auto;padding:22px 18px 40px}
.route h2{font-size:clamp(26px,5vw,40px)}
.route>p{color:var(--muted);margin:6px 0 20px;max-width:62ch}
.path{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:34px}
.path::before{content:"";position:absolute;left:14px;top:20px;bottom:20px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.stop{position:relative;display:flex;gap:16px;align-items:center;text-align:left;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:rgba(4,20,10,.75)}
.stop::before{content:"";position:absolute;left:-28px;width:16px;height:16px;border-radius:50%;background:var(--pc);box-shadow:0 0 14px var(--pc)}
.stop .planet{width:54px;height:54px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 85%,#fff),color-mix(in srgb,var(--pc) 50%,#000) 70%);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#000}
.stop h3{font-size:18px}.stop p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.stop .res{margin-left:auto;text-align:right;font-family:var(--display);font-size:13px;color:var(--muted);flex:none}
.stop .res b{display:block;color:#ffd166;font-size:16px;letter-spacing:2px}
.stop.locked{opacity:.42;cursor:not-allowed}.stop.locked::before{background:#333;box-shadow:none}
.stop:not(.locked):hover{border-color:var(--pc)}

/* play */
.play{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:22px;align-items:start}
.panel{position:sticky;top:72px;display:flex;flex-direction:column;gap:12px}
.mcard{border-radius:16px;padding:14px 16px;background:linear-gradient(120deg,color-mix(in srgb,var(--w) 22%,#03140a),#03140a 75%);border:1.5px solid color-mix(in srgb,var(--w) 50%,transparent)}
.mcard .tag{font-family:var(--display);font-size:13px;color:var(--w);font-weight:600}
.mcard h2{font-size:22px;margin:2px 0 8px}
.prog{display:flex;gap:4px}.prog span{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}.prog span.on{background:var(--w)}
.instr{border-radius:16px;padding:16px;background:rgba(3,14,8,.88);border:1.5px solid var(--line)}
.instr .kind{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-family:var(--display);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.p{border-color:var(--warn);color:var(--warn)}
.chip.do{border-color:var(--w);color:var(--w)}
.instr .say{font-size:18px;font-weight:500;margin:0}
.instr .src{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-size:15.5px;line-height:1.3}
.opt:hover{border-color:var(--w)}
.opt.right{border-color:var(--ok);background:rgba(127,224,122,.12)}.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.12)}
.opts.lock .opt{pointer-events:none}
.fb{border-radius:12px;padding:11px 14px;font-size:15px;animation:in .2s}
.fb.ok{background:rgba(127,224,122,.1);border:1px solid rgba(127,224,122,.45)}
.fb.bad{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.45)}
.fb.hint{background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.45)}
.fb b{font-family:var(--display)}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.cap{font-size:12.5px;color:var(--muted);text-align:center}
.dev{position:relative;max-width:100%}
.dev.phone{padding:10px;border-radius:40px;background:linear-gradient(145deg,#2a2f2c,#0b0d0c);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 0 2px #3a403c}
.dev.phone .shot{border-radius:30px;overflow:hidden}
.dev.phone .shot img{height:min(calc(100dvh - 150px),760px);min-height:440px;width:auto;max-width:100%;display:block}
.dev.web{width:100%;border-radius:12px;overflow:hidden;background:#1d2420;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.dev.web .bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#2c3430}
.dev.web .bar i{width:10px;height:10px;border-radius:50%;background:#5c6762}
.dev.web .bar span{margin-left:10px;font-size:11.5px;color:#aab6b0;background:#1d2420;padding:2px 12px;border-radius:6px}
.dev.web .shot img{width:100%;display:block}
.shot{position:relative;cursor:crosshair;user-select:none;-webkit-user-select:none}
.shot.noclick{cursor:default}
.zone{position:absolute;border-radius:6px;border:2px solid transparent}
.zone.hintz{border-color:var(--warn);box-shadow:0 0 0 4px rgba(255,200,87,.35);animation:pz 1s ease-in-out infinite}
.zone.good{border-color:var(--ok);background:rgba(127,224,122,.18)}
.zone.badz{border-color:var(--bad);background:rgba(255,107,107,.15)}
@keyframes pz{50%{box-shadow:0 0 0 8px rgba(255,200,87,.15)}}
.ripple{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--bad);pointer-events:none;animation:rp .6s forwards}
@keyframes rp{to{transform:scale(2);opacity:0}}
.kpad{position:absolute;left:8%;right:8%;bottom:6%;z-index:3;background:#fff;color:#16201a;border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:in .2s}
.kpad label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.kpad .row{display:flex;gap:8px}
.kpad input{flex:1;min-width:0;font:inherit;font-size:18px;padding:9px 10px;border-radius:10px;border:1.5px solid #9aaba0}
.kpad button{padding:9px 14px;border-radius:10px;background:#2E7D32;color:#fff;font-weight:700}
.kpad small{display:block;margin-top:6px;color:#5b6b61;font-size:12px}
.scene{width:min(520px,100%);border-radius:20px;padding:26px 22px;background:radial-gradient(circle at 30% 0%,color-mix(in srgb,var(--w) 25%,#06180c),#04110a 75%);border:1.5px solid color-mix(in srgb,var(--w) 50%,transparent);font-size:18px}
.scene .who{font-family:var(--display);color:var(--w);font-weight:600;font-size:14px;margin-bottom:6px}
.endcard{max-width:640px;margin:20px auto;padding:26px 22px;border-radius:20px;text-align:center;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--w) 32%,#03140a),#03140a 70%);border:2px solid var(--w)}
.endcard h2{font-size:clamp(26px,5vw,38px)}
.endcard .stars{font-size:34px;color:#ffd166;letter-spacing:6px;margin:6px 0}
.endcard ul{text-align:left;color:#dcebdf;padding-left:20px}
.endcard .srcs{font-size:13px;color:var(--muted);margin-top:4px}
.shake{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (max-width:860px){
  .play{grid-template-columns:1fr;gap:12px;padding:10px}
  .panel{position:static;gap:8px}
  .panel.stk{position:sticky;top:58px;z-index:4}
  .mcard{display:none}
  .instr{padding:12px 14px;background:rgba(3,14,8,.96)}
  .instr .say{font-size:16px}
  .instr .src{display:none}
  .dev.phone{padding:6px;border-radius:30px}
  .dev.phone .shot{border-radius:24px}
  .dev.phone .shot img{height:auto;width:min(92vw,400px);min-height:0}
  .top .who span.rl,.top .pre{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- estado ---------- */
const KEY="cs-practica-real-v1";
let G={name:"",rol:"",done:{}};
try{const r=localStorage.getItem(KEY);if(r)G=Object.assign(G,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}};
const app=document.getElementById("app");
const $=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let skyColor="#92D050";const setColor=c=>{document.documentElement.style.setProperty("--w",c);skyColor=c};
const totals=()=>{let s=0,m=0;Object.values(G.done).forEach(d=>{s+=d.stars;m+=d.misses});return{s,m,n:Object.keys(G.done).length}};
function topbar(extra){const t=totals();return `<div class="top"><div class="who"><span class="star"></span>${esc(G.name||"")}${G.rol?`<span class="rl">· ${esc(G.rol)}</span>`:""}</div><span class="pre">Pre-entregable</span>${extra||`<div class="metric">Misiones<b>${t.n}/${M.length}</b></div><div class="metric">Estrellas<b>${t.s}</b></div>`}</div>`}

function intro(){
  setColor("#92D050");app.innerHTML="";
  const el=$(`<div class="intro"><div class="intro-in"><div class="kicker"><span class="star"></span>Contract Simulator 2026</div>
   <h1 class="hero">Práctica en<span>pantallas reales</span></h1>
   <p>Practica con las capturas reales del Simulador de Contratos que vienen en el training y en el manual. Toca la pantalla como lo harías en tu teléfono o en la web: busca, selecciona, captura y lee resultados.</p>
   <div class="legend"><div><b>Pantallas reales</b>Capturas del material oficial, con sus datos de ejemplo</div><div><b>Fuente en cada paso</b>Cada instrucción indica de qué diapositiva o sección sale</div><div class="p"><b>Situación de práctica</b>Marca los casos que planteamos para practicar una regla documentada</div></div>
   <div class="namebox"><input id="nm" maxlength="32" placeholder="Tu nombre" value="${esc(G.name)}" aria-label="Tu nombre">
   <select id="rol" aria-label="Tu rol"><option value="">¿Cuál es tu rol?</option>${["Arrendatario","Operativo","Líder Comercial","Asesor Comercial"].map(r=>`<option ${G.rol===r?"selected":""}>${r}</option>`).join("")}</select>
   <button class="btn" id="go">${G.name?"Continuar":"Empezar"}</button></div>
   ${G.name?'<p><button class="btn ghost small" id="reset">Reiniciar progreso</button></p>':""}</div></div>`);
  app.append(el);
  const go=()=>{const i=el.querySelector("#nm");if(!i.value.trim()){i.focus();i.classList.add("shake");setTimeout(()=>i.classList.remove("shake"),400);return}G.name=i.value.trim();G.rol=el.querySelector("#rol").value;save();map()};
  el.querySelector("#go").onclick=go;el.querySelector("#nm").onkeydown=e=>{if(e.key==="Enter")go()};
  const r=el.querySelector("#reset");if(r)r.onclick=()=>{if(confirm("¿Borrar tu progreso?")){G={name:"",rol:"",done:{}};save();intro()}};
}
function map(){
  setColor("#92D050");window.scrollTo(0,0);const all=M.every(m=>G.done[m.id]);
  app.innerHTML=topbar();
  const el=$(`<div class="route"><h2>${all?"Recorrido completo":"Tus misiones"}</h2><p>${all?"Completaste todas las misiones. Repite las que quieras para subir tus estrellas.":"Avanza en orden. Cada misión practica una parte del uso real de la herramienta."}</p><div class="path"></div>${all?'<p style="margin-top:20px"><button class="btn" id="sum">Ver mi resumen</button></p>':""}<p style="margin-top:20px"><button class="btn ghost small" id="ch">Cambiar nombre</button></p></div>`);
  const p=el.querySelector(".path");
  M.forEach((m,i)=>{const lock=i>0&&!G.done[M[i-1].id],d=G.done[m.id];
    const b=$(`<button class="stop ${lock?"locked":""}" style="--pc:${m.color}"><span class="planet">${i+1}</span><span><h3>${esc(m.title)}</h3><p>${esc(m.sub)}</p></span><span class="res">${d?`<b>${"★".repeat(d.stars)}${"☆".repeat(3-d.stars)}</b>${m.steps.length} pasos`:lock?"Bloqueada":`${m.steps.length} pasos`}</span></button>`);
    b.onclick=()=>{if(lock){b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);return}play(i)};p.append(b)});
  app.append(el);const s=el.querySelector("#sum");if(s)s.onclick=summary;el.querySelector("#ch").onclick=intro;
}

/* ---------- juego ---------- */
let R;
function play(i){const m=M[i];setColor(m.color);R={i,m,k:0,misses:0,stepMiss:0,phase:"do"};render()}
function render(){
  const {m,k}=R,s=m.steps[k];window.scrollTo(0,0);R.stepMiss=0;R.phase="do";
  app.innerHTML=topbar(`<div class="metric">Paso<b>${k+1}/${m.steps.length}</b></div><div class="metric">Fallos<b id="mm">${R.misses}</b></div><button class="btn ghost small" id="exit">Salir</button>`);
  const verb={tap:"Toca en la pantalla",input:"Toca el campo y captura",ask:"Responde",card:"Responde"}[s.t];
  const el=$(`<div class="play"><div class="panel ${s.t==="tap"||s.t==="input"?"stk":""}">
    <div class="mcard"><div class="tag">Misión ${R.i+1} de ${M.length}</div><h2>${esc(m.title)}</h2><div class="prog">${m.steps.map((_,j)=>`<span class="${j<=k?"on":""}"></span>`).join("")}</div></div>
    <div class="instr"><div class="kind"><span class="chip do">${verb}</span>${s.prac?'<span class="chip p">Situación de práctica</span>':""}</div><p class="say">${esc(s.say)}</p><p class="src">Fuente: ${esc(s.src)}</p><div id="optbox"></div></div>
    <div id="fb"></div></div><div class="stage" id="stage"></div></div>`);
  app.append(el);
  app.querySelector("#exit").onclick=()=>{if(confirm("¿Salir de la misión? Se perderá el avance de esta misión."))map()};
  const st=el.querySelector("#stage");
  if(s.t==="card"){st.append($(`<div class="scene"><div class="who">${esc(s.who)}</div>${esc(s.scene)}</div>`))}
  else st.append(device(s));
  if(s.t==="ask"||s.t==="card") options(s);
}
function device(s){
  const im=IMG[s.img],web=!!WEB[s.img];
  const d=$(`<div class="dev ${web?"web":"phone"}">${web?'<div class="bar"><i></i><i></i><i></i><span>app.powerbi.com · Simulador de Contratos</span></div>':""}<div class="shot ${s.t==="ask"?"noclick":""}"><img src="${im.src}" alt="Captura real del Simulador de Contratos" draggable="false"></div></div>`);
  const cap=$(`<div class="cap">Captura real del material de capacitación · datos de ejemplo</div>`);
  const wrap=$(`<div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%"></div>`);wrap.append(d,cap);
  const shot=d.querySelector(".shot");
  if(s.t==="tap"||s.t==="input"){
    const z=HS[s.img]||{};
    // zonas: objetivo primero para que gane en traslapes
    const keys=[s.target].concat(Object.keys(z).filter(x=>x!==s.target));
    keys.forEach(key=>{const r=z[key];if(!r)return;
      const b=$(`<button class="zone" data-z="${key}" aria-label="${esc(lab(s.img,key))}" style="left:${r[0]}%;top:${r[1]}%;width:${r[2]-r[0]}%;height:${r[3]-r[1]}%;z-index:${key===s.target?2:1}"></button>`);
      b.onclick=e=>{e.stopPropagation();tapZone(s,key,b,shot,e)};shot.append(b)});
    shot.addEventListener("click",e=>{if(R.phase!=="do")return;miss(s,null,shot,e)});
  }
  return wrap;
}
const lab=(img,key)=>(LBLI[img]&&LBLI[img][key])||LBL[key]||key;
function fb(html,cls){const f=document.getElementById("fb");f.innerHTML=`<div class="fb ${cls}">${html}</div>`}
function upd(){const e=document.getElementById("mm");if(e)e.textContent=R.misses}
function ripple(shot,e){const r=shot.getBoundingClientRect();const x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+r.height/2)-r.top;const p=$(`<span class="ripple" style="left:${x}px;top:${y}px"></span>`);shot.append(p);setTimeout(()=>p.remove(),650)}
function miss(s,key,shot,e){
  R.misses++;R.stepMiss++;upd();ripple(shot,e);
  const msg=key?(s.wrong&&s.wrong[key])||`Tocaste ${esc(lab(s.img,key))}. No es lo que buscas.`:"Ahí no hay lo que buscas. Fíjate bien en la pantalla.";
  fb(`<b>Intenta de nuevo.</b> ${msg}${R.stepMiss>=2?" Te marcamos dónde está.":""}`,"bad");
  if(R.stepMiss>=2){const t=shot.querySelector(`[data-z="${s.target}"]`);if(t)t.classList.add("hintz")}
}
function tapZone(s,key,b,shot,e){
  if(R.phase!=="do")return;
  if(key!==s.target){b.classList.add("badz");setTimeout(()=>b.classList.remove("badz"),600);return miss(s,key,shot,e)}
  b.classList.remove("hintz");b.classList.add("good");
  if(s.t==="input"){R.phase="input";return keypad(s,shot)}
  R.phase="done";success(s.done);
}
function keypad(s,shot){
  const k=$(`<div class="kpad"><label>${esc(lab(s.img,s.target))}${s.unit==="meses"?" (meses)":s.unit==="$"?" ($)":""}</label><div class="row"><input inputmode="numeric" autocomplete="off" aria-label="Valor"><button>Aceptar</button></div><small>Escribe el valor que indica la instrucción.</small></div>`);
  shot.append(k);const inp=k.querySelector("input");setTimeout(()=>inp.focus(),50);
  const ok=()=>{const v=inp.value.replace(/[^0-9.]/g,"").replace(/\.0+$/,"");
    if(v===s.value){k.remove();R.phase="done";success(`${s.done} Valor: ${s.unit==="$"?"$"+Number(v).toLocaleString("es-MX"):v+" "+s.unit}.`)}
    else{R.misses++;upd();inp.classList.add("shake");setTimeout(()=>inp.classList.remove("shake"),400);fb(`<b>Revisa el valor.</b> La instrucción pide ${s.unit==="$"?"$"+Number(s.value).toLocaleString("es-MX"):s.value+" "+s.unit}.`,"bad")}};
  k.querySelector("button").onclick=ok;inp.onkeydown=e=>{if(e.key==="Enter")ok()};
}
function options(s){
  const box=document.getElementById("optbox");const o=shuffle(s.opts);
  box.innerHTML=`<div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x[0])}</button>`).join("")}</div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=!!o[+b.dataset.j][1];box.querySelector(".opts").classList.add("lock");
    b.classList.add(ok?"right":"wrong");
    if(!ok){R.misses++;upd();box.querySelectorAll(".opt").forEach(x=>{if(o[+x.dataset.j][1])x.classList.add("right")})}
    success(s.why,ok?"ok":"bad",ok?"Correcto.":"La respuesta correcta está marcada.");
  });
}
function success(text,cls="ok",title="Bien."){
  fb(`<b>${title}</b> ${esc(text)}<div style="margin-top:10px"><button class="btn small" id="nx">${R.k<R.m.steps.length-1?"Continuar":"Terminar misión"}</button></div>`,cls);
  const n=document.getElementById("nx");n.focus({preventScroll:true});
  n.onclick=()=>{R.k++;if(R.k<R.m.steps.length)render();else finish()};
}
function finish(){
  const m=R.m,stars=R.misses<=1?3:R.misses<=4?2:1;const prev=G.done[m.id];
  if(!prev||stars>prev.stars||(stars===prev.stars&&R.misses<prev.misses))G.done[m.id]={stars,misses:R.misses};save();
  window.scrollTo(0,0);app.innerHTML=topbar();
  const el=$(`<div class="route"><div class="endcard"><h2>Misión completada</h2><div class="stars">${"★".repeat(stars)}<span style="opacity:.25">${"★".repeat(3-stars)}</span></div>
   <p style="color:var(--muted);margin:0">${R.misses} fallo${R.misses===1?"":"s"}</p>
   <ul>${m.learn.map(l=>`<li>${esc(l)}</li>`).join("")}</ul><div class="srcs">Fuente: ${esc(m.src)}</div>
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="btn" id="nx">${R.i<M.length-1?"Siguiente misión":"Ver resumen"}</button><button class="btn ghost" id="rp">Repetir</button><button class="btn ghost" id="mp">Mapa</button></div></div></div>`);
  app.append(el);
  el.querySelector("#nx").onclick=()=>R.i<M.length-1?play(R.i+1):summary();
  el.querySelector("#rp").onclick=()=>play(R.i);el.querySelector("#mp").onclick=map;
}
function summary(){
  setColor("#92D050");window.scrollTo(0,0);const t=totals();
  const d=new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
  app.innerHTML=topbar();
  const el=$(`<div class="route"><div class="endcard"><span class="star" style="width:36px;height:36px"></span><h2 style="margin-top:8px">Práctica completada</h2>
   <p style="color:#cfe3d3;margin:6px 0">${esc(G.name)}${G.rol?" · "+esc(G.rol):""} · ${d}</p><div class="stars">${t.s} / ${M.length*3} ★</div>
   <ul>${M.map(m=>`<li><b>${esc(m.title)}:</b> ${esc(m.learn[0])}</li>`).join("")}</ul>
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="btn" id="mp">Volver a las misiones</button><button class="btn ghost" id="pr">Imprimir</button></div></div></div>`);
  app.append(el);el.querySelector("#mp").onclick=map;el.querySelector("#pr").onclick=()=>{try{window.print()}catch(e){}};
}

/* ---------- cielo ---------- */
const cv=document.getElementById("sky"),cx=cv.getContext("2d");let stars=[];
function rs(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;stars=Array.from({length:Math.min(180,Math.floor(innerWidth*innerHeight/7000))},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}))}
rs();addEventListener("resize",rs);const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fr(){const W=cv.width,H=cv.height;cx.fillStyle="rgba(2,15,8,.45)";cx.fillRect(0,0,W,H);
 for(const s of stars){s.z-=still?0:.001;if(s.z<=.02){s.z=1;s.x=Math.random()*2-1;s.y=Math.random()*2-1}
 const px=W/2+s.x/s.z*W*.35,py=H/2+s.y/s.z*H*.35,r=(1-s.z)*1.8*devicePixelRatio;cx.fillStyle=s.z<.3?skyColor:"rgba(234,245,236,"+(1-s.z)*.7+")";cx.beginPath();cx.arc(px,py,r,0,7);cx.fill()}
 if(!still)requestAnimationFrame(fr)}
cx.fillStyle="#020f08";cx.fillRect(0,0,cv.width,cv.height);fr();
G.name?map():intro();
</script>
